---
dependency:
  name: galaxy
driver:
  name: docker
lint:
  name: yamllint
platforms:
  - name: instance
    image: centos:7
provisioner:
  name: ansible
  env:
    CLUSTER_ALIAS: foo_prod
  inventory:
    host_vars:
      localhost:
        CLUSTER_ALIAS: foo_prod
      instance:
        CLUSTER_ALIAS: foo_prod
  lint:
    name: ansible-lint
scenario:
  name: default
verifier:
  name: testinfra
  lint:
    name: flake8
