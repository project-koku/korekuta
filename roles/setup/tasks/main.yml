---
# tasks file for setup

- name: Check for CLUSTER_ALIAS input
  fail:
    msg: "You must supply '-e CLUSTER_ALIAS=<cluster_alias>'."
  when:
    - not CLUSTER_ALIAS is defined

- name: Check for CLUSTER_API input
  fail:
    msg: "You must supply '-e CLUSTER_API=<cluster_api>'."
  when:
    - not CLUSTER_API is defined

- name: Check for CLUSTER_USER input
  fail:
    msg: "You must supply '-e CLUSTER_USER=<cluster_user>'."
  when:
    - not CLUSTER_USER is defined

- name: Check for CLUSTER_TOKEN_PATH input
  fail:
    msg: "You must supply '-e CLUSTER_TOKEN_PATH=</path/to/file/with/ocp/token>'."
  when:
    - not CLUSTER_TOKEN_PATH is defined

- name: Check that CLUSTER_TOKEN_PATH exists
  stat:
    path: "{{ CLUSTER_TOKEN_PATH }}"
  register: cluster_token_stat_result

- name: CLUSTER_TOKEN_PATH does not exits
  fail:
    msg: "No file was found for CLUSTER_TOKEN_PATH at '{{ CLUSTER_TOKEN_PATH }}'."
  when:
    - not cluster_token_stat_result.stat.exists

- name: Generate random UUID for cluster identifier
  set_fact:
    cluster_id: "{{ 9999999999999999999999 | random | to_uuid }}"

- name: Create config data location
  file:
    path: "{{ ansible_env.HOME }}/.config/ocp_usage"
    state: directory
    mode: 0755

- name: Create setup data configuration
  set_fact:
    config_json: '{"ocp_api":"{{ CLUSTER_API }}","ocp_user":"{{ CLUSTER_USER }}","ocp_token_file":"{{ CLUSTER_TOKEN_PATH }}", "cluster_alias": "{{ CLUSTER_ALIAS }}", "cluster_id": "{{ cluster_id }}"}'

- name: Record setup inputs
  copy:
    content: "{{ config_json }}"
    dest: "{{ ansible_env.HOME }}/.config/ocp_usage/config.json"
